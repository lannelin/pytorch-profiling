[project]
name = "pytorch-profiling"
version = "0.0.1"

# TODO min,max
dependencies = [
    "lightning==2.3.0",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "tensorboard==2.18.0",
    "torch-tb-profiler==0.4.3",
    "jsonargparse[signatures]>=4.27.7",
    "scipy==1.14.1",
]

[tool.black]
line-length = 79
include = '\.pyi?$'

[tool.isort]
profile = "black"
