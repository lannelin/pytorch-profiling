[project]
name = "pytorch-profiling"
version = "0.0.1"

# TODO min,max
"dependencies" = [
    "lightning==2.5.6",
    "torch==2.9.1",
    "torch-tb-profiler==0.4.3",
    "torchvision==0.24.1",
    "tensorboard==2.20.0",
    "jsonargparse[signatures]>=4.43.0",
]

[tool.black]
line-length = 79
include = '\.pyi?$'

[tool.isort]
profile = "black"
